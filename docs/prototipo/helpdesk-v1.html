<!doctype html>
<!--
  Protótipo navegável do HelpDesk Corporativo (v1).
  Abre direto no navegador, sem servidor e sem fonte externa. Os dados são fictícios: os mesmos do seed.
  A barra escura no topo não faz parte do sistema: troca a tela, o perfil e o estado da página.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HelpDesk Corporativo · protótipo</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f7f8f9;
  --fg: #1e2939;
  --muted: #6a7282;
  --ink-2: #4a5565;
  --line: #e4e6ea;
  --line-strong: #c9ced6;
  --brand: #78a118;          /* verde da marca: destaques, foco, ícones */
  --brand-btn: #587a11;      /* fundo dos botões: contraste AA com texto branco */
  --brand-btn-hover: #4f6d10;
  --brand-ink: #4f6d10;      /* texto verde sobre fundo claro */
  --brand-050: #eef5df;
  --accent: #59c935;
  --azul: #1d4f9c;           /* texto da marca do produto */
  --marca-fundo: #1d4f9c;
  --recolher: #2c6e8f;
  --item: #2d3748;
  --perigo: #b42318;
  --toast: #1e2939;
  --menu-bg: #fafafa;
  --hover: #f0f1f3;
  --ok-bg: #e7f8e0;   --ok-ink: #3c7a12;
  --info-bg: #e6f0f5; --info-ink: #2c6e8f;
  --warn-bg: #fdf3e1; --warn-ink: #8a5a12;
  --crit-bg: #fdecea; --crit-ink: #b42318;
  --off-bg: #eef0f3;  --off-ink: #4a5565;
  --shadow: 0 1px 2px rgba(30,41,57,.05), 0 1px 12px rgba(30,41,57,.05);
  --font: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
/* Tema escuro: opção "Modo escuro" no menu do usuário ou na barra do protótipo. */
:root[data-tema="escuro"] {
  color-scheme: dark;
  --bg: #13171d;
  --surface: #1a1f27;
  --surface-2: #222833;
  --fg: #e6e9ee;
  --muted: #9aa3b2;
  --ink-2: #c3c9d3;
  --line: #2b323d;
  --line-strong: #3b4451;
  --brand: #8db82a;
  --brand-btn: #587a11;
  --brand-btn-hover: #6a8f16;
  --brand-ink: #a9d24a;
  --brand-050: #26311a;
  --azul: #7aa8ee;
  --item: #d6dbe3;
  --toast: #2b323d;
  --menu-bg: #161a21;
  --hover: #252c37;
  --ok-bg: #1c3218;   --ok-ink: #7fdc5e;
  --info-bg: #1b2c36; --info-ink: #6fb3d6;
  --warn-bg: #33270f; --warn-ink: #e0b050;
  --crit-bg: #3a1a17; --crit-ink: #f07070;
  --off-bg: #2b323d;  --off-ink: #c3c9d3;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 12px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Barra do protótipo (fora do sistema) ===== */
.proto { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px;
  background: #1e2939; color: #e6e9ee; font-size: 12.5px; }
.proto b { color: #fff; }
.proto-tag { background: #59c935; color: #10200a; font-weight: 800; border-radius: 4px; padding: 2px 7px; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
.proto label { display: inline-flex; align-items: center; gap: 6px; color: #aab2bf; }
.proto select { background: #2b323d; color: #fff; border: 1px solid #3b4451; border-radius: 6px; padding: 4px 6px; font-size: 12.5px; }
.proto-seg { display: inline-flex; border: 1px solid #3b4451; border-radius: 6px; overflow: hidden; }
.proto-seg button { background: #2b323d; color: #c3c9d3; border: 0; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.proto-seg button + button { border-left: 1px solid #3b4451; }
.proto-seg button[aria-pressed="true"] { background: #59c935; color: #10200a; font-weight: 700; }
.proto-aviso { margin-left: auto; color: #aab2bf; }

/* ===== Casca: cabeçalho e menu lateral ===== */
.top { position: sticky; top: var(--proto-h, 41px); z-index: 30; height: 64px; display: flex; align-items: center; background: var(--surface);
  border-bottom: 1px solid var(--line); box-shadow: 0 1px 4px rgba(30,41,57,.05); }
.marca { position: relative; width: 240px; height: 100%; flex: none; display: flex; align-items: center; gap: 10px; padding-left: 22px; transition: width .2s, padding .2s; }
.marca-ic { width: 32px; height: 32px; border-radius: 9px; background: var(--marca-fundo); display: grid; place-items: center; flex: none; }
.marca-ic span { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.marca-txt { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
.marca-txt b { font-size: 17px; font-weight: 800; color: var(--azul); letter-spacing: -.3px; }
.marca-txt small { font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; }
.recolher { position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0;
  background: var(--recolher); color: #fff; display: grid; place-items: center; cursor: pointer; z-index: 2; }
.top-d { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-right: 24px; }
.top-sep { width: 1px; height: 30px; background: var(--line); }
.usuario { position: relative; }
.usuario-b { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; padding: 4px 6px; border-radius: 10px; text-align: right; }
.usuario-b:hover { background: var(--hover); }
.usuario-n { display: flex; flex-direction: column; line-height: 1.2; }
.usuario-n b { font-size: 13px; }
.usuario-n small { font-size: 11.5px; color: var(--muted); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand-050); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.um { position: absolute; top: calc(100% + 8px); right: 0; width: 240px; z-index: 35; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.16); padding: 6px 0; }
.um-id { padding: 8px 14px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; font-size: 12.5px; color: var(--muted); }
.um-id b { display: block; color: var(--fg); font-size: 13.5px; }
.um-i { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border: 0; background: none; cursor: pointer; text-align: left; font-size: 13.5px; }
.um-i:hover { background: var(--hover); }
.um-i .lado { margin-left: auto; color: var(--muted); display: grid; place-items: center; }

.corpo { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 64px - var(--proto-h, 41px)); transition: grid-template-columns .2s; }
.menu { position: sticky; top: calc(64px + var(--proto-h, 41px)); height: calc(100vh - 64px - var(--proto-h, 41px)); background: var(--menu-bg);
  border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
.nav { padding: 16px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.nav-grupo { margin: 14px 10px 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 7px; background: transparent; cursor: pointer;
  font-size: 13.5px; font-weight: 600; color: var(--item); text-align: left; white-space: nowrap; position: relative; }
.item:hover { background: var(--hover); }
.item[aria-current="page"] { background: var(--brand-050); color: var(--brand-ink); }
.item[aria-current="page"]::before { content: ''; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
.item-ic { display: grid; place-items: center; flex: none; color: var(--ink-2); }
.item[aria-current="page"] .item-ic { color: var(--brand-ink); }
.item-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.item-n { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; background: var(--warn-bg); color: var(--warn-ink); }
.recolhido .marca { width: 64px; padding-left: 16px; }
.recolhido .marca-txt { display: none; }
.recolhido .corpo { grid-template-columns: 64px minmax(0, 1fr); }
.recolhido .item { justify-content: center; padding: 10px 0; }
.recolhido .item-txt, .recolhido .nav-grupo, .recolhido .item-n { display: none; }

/* ===== Página ===== */
.main { padding: 26px clamp(16px, 3vw, 40px) 48px; min-width: 0; }
.pg-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.pg-sec { margin: 0 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--brand-ink); }
.pg-h h1 { font-size: 26px; font-weight: 650; letter-spacing: -.3px; }
.pg-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; gap: 7px; background: var(--brand-btn); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px;
  font-weight: 700; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--brand-btn-hover); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-sec { background: var(--surface); color: var(--fg); border: 1px solid var(--line-strong); }
.btn-sec:hover { background: var(--surface-2); border-color: var(--brand); }
.btn-perigo { background: var(--perigo); }
.btn-perigo:hover { background: color-mix(in srgb, var(--perigo) 82%, #000); }
.btn-p { padding: 7px 12px; font-size: 12.5px; }
.lnk { border: 0; background: none; padding: 0; color: var(--brand-ink); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }

/* cartões do painel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 4px; cursor: pointer; color: var(--fg); position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.kpi:hover { border-color: var(--c); }
.kpi-l { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.kpi-n { font-size: 32px; font-weight: 750; line-height: 1.1; }
.kpi-t { font-size: 12.5px; color: var(--muted); }
.paineis { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.card .pg-sub { margin: 0 0 14px; }
.dist { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 6px 0 14px; }
.dist span { display: block; height: 100%; }
.leg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
.leg-i { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.leg-i i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.leg-i b { margin-left: auto; }
.lista-c { display: flex; flex-direction: column; }
.lista-c > div { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.lista-c > div:first-child { border-top: 0; }
.lista-c .grow { flex: 1; min-width: 0; }
.lista-c small { color: var(--muted); display: block; }

/* filtros */
.fbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; padding: 14px 16px; margin-bottom: 16px; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 10px; }
.fbar .campo { width: 220px; }
.fbar .conta { margin-left: auto; font-size: 13px; color: var(--muted); padding-bottom: 9px; }

/* campos */
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo > label, .campo-l { font-size: 11.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-2); }
.campo-l small, .campo > label small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
.input, .select, .textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.textarea { resize: vertical; min-height: 84px; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-050); }
.invalido .input, .invalido .select, .invalido .textarea { border-color: var(--crit-ink); }
.invalido .input:focus, .invalido .select:focus, .invalido .textarea:focus { box-shadow: 0 0 0 3px var(--crit-bg); }
.erro-campo { font-size: 12.5px; color: var(--crit-ink); margin: 0; display: none; }
.invalido .erro-campo { display: block; }
.dica { font-size: 12.5px; color: var(--muted); margin: 0; }
.form { max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
.form-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.form-acoes { display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 16px; }

/* avisos */
.alerta { display: flex; gap: 10px; align-items: flex-start; border-radius: 10px; padding: 12px 14px; font-size: 13px; border: 1px solid; }
.alerta.crit { background: var(--crit-bg); border-color: color-mix(in srgb, var(--crit-ink) 30%, transparent); color: var(--crit-ink); }
.alerta.info { background: var(--info-bg); border-color: color-mix(in srgb, var(--info-ink) 30%, transparent); color: var(--info-ink); }
.alerta.ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok-ink) 30%, transparent); color: var(--ok-ink); }
.alerta b { display: block; }

/* tabela */
.tabela-w { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-2); padding: 11px 16px;
  background: var(--surface-2); border-bottom: 1px solid var(--line); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clicavel { cursor: pointer; }
tbody tr.clicavel:hover { background: var(--surface-2); }
tbody tr.novo { animation: realce 2.2s ease-out; }
@keyframes realce { from { background: var(--brand-050); } to { background: transparent; } }
.eq-n { font-weight: 700; }
.col-id { width: 72px; color: var(--muted); font-weight: 600; }
.col-acao { text-align: right; width: 1%; white-space: nowrap; color: var(--muted); }

/* etiquetas de status */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.DISPONIVEL, .st.APROVADA { background: var(--ok-bg); color: var(--ok-ink); }
.st.EMPRESTADO { background: var(--info-bg); color: var(--info-ink); }
.st.MANUTENCAO, .st.PENDENTE { background: var(--warn-bg); color: var(--warn-ink); }
.st.INATIVO, .st.CANCELADA { background: var(--off-bg); color: var(--off-ink); }
.st.RECUSADA { background: var(--crit-bg); color: var(--crit-ink); }

/* solicitações */
.sols { display: flex; flex-direction: column; gap: 10px; }
.sol { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.sol-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 18px; align-items: start; }
.sol-t { font-weight: 700; font-size: 16px; }
.sol-id { color: var(--muted); font-weight: 600; margin-right: 6px; }
.sol-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.sol-meta b { color: var(--fg); font-weight: 600; }
.sol-d { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 20px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--surface-2); }
.info-i { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.info-l { font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.info-v { font-size: 14px; font-weight: 600; color: var(--fg); }
.info-v.fraco { font-weight: 500; color: var(--ink-2); }
.info-s { font-size: 12.5px; color: var(--muted); }
.ficha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--surface-2); }
.ficha .info-i:first-child { grid-column: 1 / -1; }
.sol-lado { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.sol-obs { margin: 0 18px 14px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--line-strong); font-size: 13px; }
.sol-obs.RECUSADA { border-left-color: var(--crit-ink); }
.sol-obs.APROVADA { border-left-color: var(--ok-ink); }
.sol-obs small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.sol-acoes { display: flex; gap: 8px; padding: 14px 18px; flex-wrap: wrap; }
.hist { border-top: 1px solid var(--line); }
.hist > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 18px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.hist > summary::-webkit-details-marker { display: none; }
.hist > summary:hover { background: var(--surface-2); }
.hist[open] > summary svg { transform: rotate(90deg); }
.hist > summary svg { transition: transform .15s; }
.linha { list-style: none; margin: 0; padding: 4px 18px 16px 30px; position: relative; }
.linha::before { content: ''; position: absolute; left: 23px; top: 10px; bottom: 22px; width: 2px; background: var(--line); }
.linha li { position: relative; padding: 6px 0 6px 18px; font-size: 13px; }
.linha li::before { content: ''; position: absolute; left: -11px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--brand); }
.linha small { color: var(--muted); display: block; }
.linha q { display: block; margin-top: 3px; color: var(--ink-2); quotes: '“' '”'; }

/* estados */
.vazio { text-align: center; padding: 48px 20px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 12px; }
.vazio h3 { color: var(--fg); font-size: 16px; margin-bottom: 6px; }
.vazio .btn { margin-top: 14px; }
.esq { background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: brilho 1.2s infinite linear; border-radius: 6px; height: 14px; }
@keyframes brilho { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.esq-kpi { height: 108px; border-radius: 12px; }
.esq-linha { display: flex; gap: 16px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
.carregando-t { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.giro { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--brand-btn); border-radius: 50%; animation: giro .8s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }

/* painel lateral e janelas */
.fundo { position: fixed; inset: 0; background: rgba(30,41,57,.45); z-index: 70; }
.gaveta { position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100vw); z-index: 80; background: var(--surface); box-shadow: -8px 0 30px rgba(30,41,57,.2);
  display: flex; flex-direction: column; }

function semSubmit(form) {
  const enviar = () => form.dispatchEvent(new Event('submit', { cancelable: true }));

  const marca = el('input', { class: 'input', id: 's-marca', placeholder: 'Opcional' });
  const modelo = el('input', { class: 'input', id: 's-modelo', placeholder: 'Opcional' });
  const desc = el('textarea', { class: 'textarea', id: 's-desc', placeholder: 'Ex.: Notebook para um treinamento externo de 3 dias.' });
  const cTipo = el('div', { class: 'campo', id: 'c-tipo' }, el('label', { for: 's-tipo' }, 'Tipo'), tipo,
    el('p', { class: 'dica' }, 'O tipo de equipamento: notebook, monitor, celular…'), el('p', { class: 'erro-campo' }, 'Informe o tipo do equipamento.'));
  const cDesc = el('div', { class: 'campo', id: 'c-desc' }, el('label', { for: 's-desc' }, 'Para que você precisa?'), desc, el('p', { class: 'erro-campo' }, 'Descreva o motivo do pedido.'));
  const resumo = el('div', { class: 'alerta crit', role: 'alert', hidden: true }, el('span', { html: ic(I.alerta) }), el('div', {}, el('b', {}, 'Dados inválidos.'), 'Corrija os campos destacados.'));
  const enviar = el('button', { class: 'btn', type: 'submit' }, 'Enviar solicitação');
  const form = el('form', { class: 'form', novalidate: true, onsubmit: (ev) => {
    ev.preventDefault();
    const erros = { tipo: !tipo.value.trim(), desc: !desc.value.trim() };
    for (const [k, v] of Object.entries(erros)) document.getElementById('c-' + k).classList.toggle('invalido', v);
    const ok = !Object.values(erros).some(Boolean);
    resumo.hidden = ok;
    if (!ok) return;
    aguardar(enviar, 'Enviando…', () => {
      const id = Math.max(...SOLICITACOES.map((s) => s.id)) + 1;
      const u = usuario();
      SOLICITACOES.push({ id, solicitanteId: u.id, equipamentoId: null, descricao: desc.value.trim(), status: 'PENDENTE', dtSolicitacao: HOJE,
        tipoSolicitado: tipo.value.trim().toLowerCase(), marcaSolicitada: marca.value.trim() || null, modeloSolicitado: modelo.value.trim() || null,
        historico: [{ usuarioId: u.id, de: null, para: 'PENDENTE', em: HOJE }] });
      ir('minhas'); toast('Solicitação #' + id + ' enviada ao aprovador.');
    });
  } },
    resumo, cTipo,
    el('div', { class: 'form-g' }, el('div', { class: 'campo' }, el('label', { for: 's-marca' }, 'Marca ', el('small', {}, '(opcional)')), marca),
      el('div', { class: 'campo' }, el('label', { for: 's-modelo' }, 'Modelo ', el('small', {}, '(opcional)')), modelo)),
    cDesc,
    el('p', { class: 'dica' }, 'O aprovador escolhe qual equipamento entregar, conforme o estoque. Se não houver, ele recusa com uma justificativa.'),
    el('div', { class: 'form-acoes' }, el('button', { class: 'btn btn-sec', type: 'button', onclick: () => ir('minhas') }, 'Cancelar'), enviar));
  semSubmit(form);
  return [cabecalhoPagina(), form];
}

function telaPendentes() {
  if (S.estado === 'carregando') return [cabecalhoPagina(), carregando('Carregando solicitações pendentes…'), esqueletoTabela(2)];
  const lista = S.estado === 'vazio' ? [] : SOLICITACOES.filter((s) => s.status === 'PENDENTE');
  if (!lista.length) return [cabecalhoPagina(), el('div', { class: 'vazio' }, el('h3', {}, 'Nenhuma solicitação pendente.'), 'Quando um solicitante fizer um pedido, ele aparece aqui.')];
  return [cabecalhoPagina(), el('div', { class: 'sols' }, ...lista.map((s) => cartaoSol(s, { mostrarSolicitante: true, acoes: [
    el('button', { class: 'btn btn-p', onclick: () => dialogoDecisao(s, 'APROVADA') }, 'Aprovar'),
    el('button', { class: 'btn btn-sec btn-p', onclick: () => dialogoDecisao(s, 'RECUSADA') }, 'Recusar')] })))];
}

function dialogoDecisao(s, decisao) {
  const aprovar = decisao === 'APROVADA';
  const fechar = () => { S.sobreposto = null; render(); };
  // Todos os disponíveis, com os do tipo pedido primeiro: o tipo é texto livre e pode não coincidir.
  const disponiveis = EQUIPAMENTOS.filter((e) => e.status === 'DISPONIVEL');
  const doTipo = disponiveis.filter((e) => e.tipo === s.tipoSolicitado);
  const outros = disponiveis.filter((e) => e.tipo !== s.tipoSolicitado);
  const opcao = (e) => el('option', { value: e.id }, e.marca + ' ' + e.modelo + ' · ' + cap(e.tipo));
  const sEquip = el('select', { class: 'select', id: 'd-equip' }, el('option', { value: '' }, 'Selecione…'),
    doTipo.length ? el('optgroup', { label: 'Do tipo pedido (' + cap(s.tipoSolicitado) + ')' }, ...doTipo.map(opcao)) : null,
    outros.length ? el('optgroup', { label: 'Outros tipos' }, ...outros.map(opcao)) : null);
  const cEquip = disponiveis.length
    ? el('div', { class: 'campo', id: 'c-d-equip' }, el('label', { for: 'd-equip' }, 'Equipamento a emprestar'), sEquip,
      el('p', { class: 'dica' }, doTipo.length + ' do tipo ' + cap(s.tipoSolicitado) + ' entre os ' + disponiveis.length + ' disponíveis.'), el('p', { class: 'erro-campo' }, 'Escolha o equipamento para aprovar.'))
    : el('div', { class: 'alerta info', id: 'c-d-equip' }, el('span', { html: ic(I.alerta) }),
      el('div', {}, el('b', {}, 'Nenhum equipamento disponível.'), 'Não há como aprovar agora. Recuse com uma justificativa ou cadastre um equipamento.'));
  const just = el('textarea', { class: 'textarea', id: 'd-just', placeholder: aprovar ? 'Opcional. Ex.: Retirar com a equipe de suporte.' : 'Ex.: Não há equipamento compatível no estoque.' });
  const cJust = el('div', { class: 'campo', id: 'c-d-just' }, el('label', { for: 'd-just' }, aprovar ? 'Observação ' : 'Justificativa', aprovar ? el('small', {}, '(opcional)') : null), just,
    el('p', { class: 'erro-campo' }, 'A justificativa é obrigatória na recusa.'));
  // A tela mostra a mensagem da API: o 409 tem duas causas, e só a API sabe qual aconteceu.
  const msgConflito = el('div', {});
  const conflito = el('div', { class: 'alerta crit', role: 'alert', hidden: true }, el('span', { html: ic(I.alerta) }), msgConflito);
  const confirmar = el('button', { class: 'btn' + (aprovar ? '' : ' btn-perigo'), onclick: () => {
    const erroEquip = aprovar && !sEquip.value, erroJust = !aprovar && !just.value.trim();
    cEquip.classList.toggle('invalido', erroEquip); cJust.classList.toggle('invalido', erroJust);
    if (erroEquip || erroJust) return;
    aguardar(confirmar, aprovar ? 'Aprovando…' : 'Recusando…', () => {
      if (S.estado === 'conflito') {
        // Simulação: na aprovação, outro aprovador entregou o equipamento; na recusa, decidiu a solicitação.
        const resposta = { status: 409, erro: aprovar ? 'O equipamento escolhido já não está disponível.' : 'A solicitação já não está pendente.' };
        msgConflito.replaceChildren(el('b', {}, 'Não foi possível concluir.'), resposta.erro);
        conflito.hidden = false; confirmar.disabled = true; return;
      }
      const u = usuario();
      if (aprovar) {
        s.equipamentoId = Number(sEquip.value);
        eqDe(s.equipamentoId).status = 'EMPRESTADO';
      }
      Object.assign(s, { status: decisao, observacao: just.value.trim() || null, dtDecisao: HOJE, aprovadorId: u.id });
      s.historico.push({ usuarioId: u.id, de: 'PENDENTE', para: decisao, em: HOJE, obs: just.value.trim() || null });
      S.sobreposto = null; render();
      toast('Solicitação #' + s.id + (aprovar ? ' aprovada. ' + nomeEq(s.equipamentoId) + ' emprestado para ' + nomeDe(s.solicitanteId) + '.' : ' recusada.'));
    });
  } }, aprovar ? 'Aprovar' : 'Recusar');
  confirmar.disabled = aprovar && !disponiveis.length;
  S.sobreposto = () => [el('div', { class: 'fundo', onclick: fechar }), el('div', { class: 'dialogo', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'd-t' },
    el('div', { class: 'dialogo-h' }, el('h2', { id: 'd-t' }, (aprovar ? 'Aprovar' : 'Recusar') + ' a solicitação #' + s.id), el('button', { class: 'fechar', 'aria-label': 'Fechar', onclick: fechar }, '×')),
    el('div', { class: 'dialogo-b' }, conflito,
      el('div', { class: 'ficha' }, info('Pedido', tituloSol(s), s.descricao), info('Solicitante', nomeDe(s.solicitanteId)), info('Solicitada em', fmtData(s.dtSolicitacao))),
      aprovar ? cEquip : null, cJust),
    el('div', { class: 'dialogo-f' }, el('button', { class: 'btn btn-sec', onclick: fechar }, 'Voltar'), confirmar))];
  render();
  (document.getElementById('d-equip') || document.getElementById('d-just')).focus();
}

// ===== Controles do protótipo =====
document.getElementById('p-tela').addEventListener('change', (e) => ir(e.target.value));
for (const b of document.querySelectorAll('#p-perfil button')) b.addEventListener('click', () => {
  S.perfil = b.dataset.v;
  if (S.tela === 'login') S.tela = inicio();
  render();
});
for (const b of document.querySelectorAll('#p-estado button')) b.addEventListener('click', () => { S.estado = b.dataset.v; render(); });
for (const b of document.querySelectorAll('#p-tema button')) b.addEventListener('click', () => trocarTema(b.dataset.v));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sobreposto) { S.sobreposto = null; render(); } });
document.addEventListener('click', (e) => {
  const um = document.querySelector('.um');
  if (um && !um.hidden && !e.target.closest('.usuario')) { um.hidden = true; document.querySelector('.usuario-b').setAttribute('aria-expanded', 'false'); }
});
window.addEventListener('resize', () => document.documentElement.style.setProperty('--proto-h', document.getElementById('proto').offsetHeight + 'px'));
render();
</script>
</body>

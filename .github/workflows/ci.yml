name: CI

# Confere cada push na staging antes da promoção para a main.
on:
  push:
    branches: [staging]
  workflow_dispatch:

# O CI só lê o código: o token do GitHub não recebe permissão de escrita.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # A mesma versão dos Dockerfile.
          node-version: 24
          cache: npm
          # O package-lock.json não fica na raiz: o cache precisa do caminho.
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Sem a opção, o oxlint termina com sucesso mesmo com avisos.
      - run: npm run lint -- --deny-warnings
      - run: npm run build

  # Sobe o projeto como quem avalia: sem .env, com docker compose up do zero.
  sistema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # O --wait espera os testes de saúde e falha se um container parar.
      - run: docker compose up -d --build --wait --wait-timeout 300
      # O login só funciona com as migrations aplicadas e o seed rodado.
      - run: |
          curl -sSf --retry 5 --retry-connrefused -c cookies.txt -X POST localhost:8080/api/login -H 'Content-Type: application/json' -d '{"email":"aprovador@example.com","senha":"Senha@123"}'
          curl -sSf -b cookies.txt localhost:8080/api/me
      - if: failure()
        run: docker compose logs
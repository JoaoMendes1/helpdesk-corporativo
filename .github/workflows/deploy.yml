name: Deploy

# Publica a cada push na main. O MySQL do servidor não é recriado, e os dados do banco ficam.
on:
  push:
    branches: [main]
  workflow_dispatch:

# O deploy entra no servidor por SSH e não usa o token do GitHub.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Duas imagens, uma por pasta, e um serviço de cada no compose do infra.
          script: |
            set -e
            cd ~/helpdesk-corporativo
            git pull origin main
            docker build -t helpdesk-corporativo-backend ./backend
            docker build -t helpdesk-corporativo-frontend ./frontend
            cd ~/infra
            docker compose up -d --force-recreate helpdesk-corporativo-backend helpdesk-corporativo-frontend
            docker image prune -f